<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Basic HTML Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }

        h1 {
            color: #333;
        }

        .btn-container {
            margin-top: 20px;
        }

        /* Basic styling for all buttons */
        .btn {
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.8;
        }

        /* Specific Button Colors */
        .btn-red { background-color: #ff4d4d; }
        .btn-green { background-color: #2ecc71; }
        .btn-blue { background-color: #3498db; }
        .btn-yellow { background-color: #f1c40f; color: black; }
        .btn-purple { background-color: #9b59b6; }
    </style>
</head>
<body>

    <!-- Replace "Your Name Here" with your actual name -->
    <h1>Hello, I am Your Name Here</h1>
    <p>Welcome to my web page!</p>

    <div class="btn-container">
        <button class="btn btn-red">Red Button</button>
        <button class="btn btn-green">Green Button</button>
        <button class="btn btn-blue">Blue Button</button>
        <button class="btn btn-yellow">Yellow Button</button>
        <button class="btn btn-purple">Purple Button</button>
    </div>

</body>
</html>
